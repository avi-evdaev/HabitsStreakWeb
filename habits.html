<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover + the meta below make it look right when added to the iPhone home screen -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
  <title>Habits Streak</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <a class="back" href="./">&larr; Home</a>
    <h1>Habits Streak</h1>

    <p id="error" class="error" role="alert" hidden></p>

    <ul id="habit-list"></ul>
    <p id="empty" class="empty" hidden>No habits yet.</p>

    <form id="add-form">
      <input id="new-habit" type="text" placeholder="New habit" maxlength="100"
             autocomplete="off" aria-label="New habit name">
      <button type="submit" class="icon add" aria-label="Add habit">+</button>
    </form>

    <!-- Bump this number on every commit so a stale cached copy is easy to spot -->
    <footer id="build">Build 7 &middot; 2026-10-28 23:31</footer>
  </main>

  <script src="habits.js"></script>
</body>
</html>
