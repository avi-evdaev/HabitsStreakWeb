<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover + the meta below make it look right when added to the iPhone home screen -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Habits Streak</title>
  <!-- start downloading the Firebase files at once instead of one step after another -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="modulepreload" href="firebase.js?v=36">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js">
  <link rel="modulepreload" href="habits.js?v=36">
  <link rel="icon" type="image/png" href="favicon.png?v=36">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=36">
  <link rel="stylesheet" href="style.css?v=36">
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <a class="back-arrow" href="./" aria-label="Back to home"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></a>
      <a class="logo" href="./"><img src="logo.png?v=36" alt="PROductive home" width="44" height="44"></a>
      <h1>Habits Streak</h1>
    </div>
  </header>
  <main>

    <!-- shown until Firebase reports whether someone is signed in, so the page is never blank -->
    <p id="checking" class="gate-text">Checking sign-in&hellip;</p>

    <section id="gate" class="gate" hidden>
      <p class="gate-text">Sign in to see your habits.</p>
      <button id="sign-in" type="button" class="block primary">Sign in with Google</button>
      <p id="gate-message" class="error" role="alert" hidden></p>
    </section>

    <div id="content" hidden>
      <p id="error" class="error" role="alert" hidden></p>

      <button id="import" type="button" class="block primary" hidden></button>

      <div class="list-tools">
        <button id="edit-toggle" type="button" class="small" hidden>Edit</button>
      </div>

      <ul id="habit-list"></ul>
      <p id="empty" class="empty" hidden>No habits yet.</p>

      <form id="add-form">
        <input id="new-habit" type="text" dir="auto" placeholder="New habit" maxlength="100"
               autocomplete="off" aria-label="New habit name">
        <button type="submit" class="icon add" aria-label="Add habit">+</button>
      </form>

      <dialog id="target-dialog" class="dialog" aria-labelledby="target-title">
        <form id="target-form" class="dialog-form">
          <h2 id="target-title" class="dialog-title"></h2>
          <p id="target-note" class="dialog-note"></p>
          <label id="target-label" for="target-input" class="form-label"></label>
          <input id="target-input" type="number" inputmode="numeric" min="1" max="1000" step="1">
          <p id="target-error" class="error" role="alert" hidden></p>
          <div class="dialog-actions">
            <button type="button" id="target-cancel" class="block">Cancel</button>
            <button type="submit" class="block primary">Save</button>
          </div>
        </form>
      </dialog>

      <div class="session">
        <span id="status">Loading&hellip;</span>
        <button id="sign-out" type="button" class="small">Sign out</button>
      </div>
    </div>

    <!-- Bump this number on every commit so a stale cached copy is easy to spot -->
    <footer id="build">Build 36 &middot; 2026-10-29 17:18</footer>
  </main>

  <script type="module" src="habits.js?v=36"></script>
</body>
</html>
