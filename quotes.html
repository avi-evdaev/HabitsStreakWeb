<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover + the meta below make it look right when added to the iPhone home screen -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Quotes</title>
  <link rel="icon" type="image/png" href="favicon.png?v=17">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=17">
  <link rel="stylesheet" href="style.css?v=17">
</head>
<body>
  <main>
    <a class="back" href="./">&larr; Home</a>
    <header class="bar">
      <a class="logo" href="./"><img src="logo.png?v=17" alt="PROductive home" width="44" height="44"></a>
      <h1>Quotes</h1>
    </header>

    <!-- shown until Firebase reports whether someone is signed in, so the page is never blank -->
    <p id="checking" class="gate-text">Checking sign-in&hellip;</p>

    <section id="gate" class="gate" hidden>
      <p class="gate-text">Sign in to see your quotes.</p>
      <button id="sign-in" type="button" class="block primary">Sign in with Google</button>
      <p id="gate-message" class="error" role="alert" hidden></p>
    </section>

    <div id="content" hidden>
      <p id="error" class="error" role="alert" hidden></p>

      <section class="featured" aria-label="Quote of the moment">
        <p id="featured-empty" class="featured-empty">No quotes yet. Add your first one below.</p>
        <blockquote id="featured" class="featured-quote" hidden>
          <p id="featured-text" class="quote-text"></p>
          <footer id="featured-author" class="quote-author"></footer>
        </blockquote>
        <button id="another" type="button" class="block primary" hidden>Another</button>
      </section>

      <form id="quote-form" class="quote-form">
        <label for="quote-text" class="form-label">Add a quote</label>
        <textarea id="quote-text" rows="4" maxlength="600" placeholder="The quote"
                  aria-label="Quote text"></textarea>
        <input id="quote-author" type="text" maxlength="100" placeholder="Author (optional)"
               autocomplete="off" aria-label="Author">
        <button type="submit" class="block wide">Add quote</button>
      </form>

      <h2 class="section-title">All quotes <span id="quote-count"></span></h2>
      <ul id="quote-list" class="quote-list"></ul>

      <div class="session">
        <span id="status">Loading&hellip;</span>
        <button id="sign-out" type="button" class="small">Sign out</button>
      </div>
    </div>

    <!-- Bump this number on every commit so a stale cached copy is easy to spot -->
    <footer id="build">Build 17 &middot; 2026-10-29 00:53</footer>
  </main>

  <script type="module" src="quotes.js?v=17"></script>
</body>
</html>
