<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover + the meta below make it look right when added to the iPhone home screen -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Reading Session</title>
  <!-- start downloading the Firebase files at once instead of one step after another -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="modulepreload" href="firebase.js?v=33">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js">
  <link rel="modulepreload" href="reading.js?v=33">
  <link rel="modulepreload" href="chart.js?v=33">
  <link rel="icon" type="image/png" href="favicon.png?v=33">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=33">
  <link rel="stylesheet" href="style.css?v=33">
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <a class="back-arrow" href="./" aria-label="Back to home"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></a>
      <a class="logo" href="./"><img src="logo.png?v=33" alt="PROductive home" width="44" height="44"></a>
      <h1>Reading Session</h1>
    </div>
  </header>
  <main>

    <!-- shown until Firebase reports whether someone is signed in, so the page is never blank -->
    <p id="checking" class="gate-text">Checking sign-in&hellip;</p>

    <section id="gate" class="gate" hidden>
      <p class="gate-text">Sign in to see your reading.</p>
      <button id="sign-in" type="button" class="block primary">Sign in with Google</button>
      <p id="gate-message" class="error" role="alert" hidden></p>
    </section>

    <div id="content" hidden>
      <p id="error" class="error" role="alert" hidden></p>

      <section id="setup">
        <label for="book" class="form-label">Book</label>
        <input id="book" type="text" dir="auto" maxlength="120" list="books" autocomplete="off"
               placeholder="Which book are you reading?">
        <datalist id="books"></datalist>
        <button id="start" type="button" class="block primary big">Start reading</button>
      </section>

      <section id="running" hidden>
        <p id="running-book" class="phase" dir="auto"></p>
        <div id="timer" class="clock" role="timer">00:00</div>
        <div class="controls">
          <button id="pause" type="button" class="block wide">Pause</button>
          <button id="finish" type="button" class="block wide primary">Finish</button>
        </div>
        <button id="discard" type="button" class="text-button">Discard this session</button>
      </section>

      <section class="stats" aria-label="Reading totals">
        <div class="stat">
          <span class="stat-label">Pages</span>
          <span id="total-pages" class="stat-value">&mdash;</span>
        </div>
        <div class="stat">
          <span class="stat-label">Time read</span>
          <span id="total-time" class="stat-value compact">&mdash;</span>
        </div>
        <div class="stat">
          <span class="stat-label">Pages / hour</span>
          <span id="pace" class="stat-value">&mdash;</span>
        </div>
      </section>

      <section class="chart-box" aria-labelledby="chart-title">
        <h2 id="chart-title" class="chart-title">Last 14 days</h2>
        <svg id="chart" viewBox="0 0 360 300" role="img"
             aria-label="Line chart of pages read and minutes read per day. The list below has the same sessions."></svg>
        <div class="legend">
          <span><i class="swatch pages"></i>Pages</span>
          <span><i class="swatch minutes"></i>Minutes</span>
        </div>
      </section>

      <h2 class="section-title">Recent sessions</h2>
      <ul id="session-list"></ul>
      <p id="sessions-empty" class="empty" hidden>No sessions yet. Pick a book and start reading.</p>

      <dialog id="finish-dialog" class="dialog" aria-labelledby="finish-title">
        <form id="finish-form" class="dialog-form">
          <h2 id="finish-title" class="dialog-title">Finish session</h2>
          <p id="finish-note" class="dialog-note"></p>
          <label for="finish-book" class="form-label">Book</label>
          <input id="finish-book" type="text" dir="auto" maxlength="120" list="books" autocomplete="off">
          <label for="finish-pages" class="form-label">Pages read</label>
          <input id="finish-pages" type="number" inputmode="numeric" min="0" max="5000" step="1" placeholder="0">
          <p id="finish-error" class="error" role="alert" hidden></p>
          <div class="dialog-actions">
            <button type="button" id="finish-cancel" class="block">Keep reading</button>
            <button type="submit" class="block primary">Save</button>
          </div>
        </form>
      </dialog>

      <div class="session">
        <span id="status">Loading&hellip;</span>
        <button id="sign-out" type="button" class="small">Sign out</button>
      </div>
    </div>

    <!-- Bump this number on every commit so a stale cached copy is easy to spot -->
    <footer id="build">Build 33 &middot; 2026-10-29 16:50</footer>
  </main>

  <script type="module" src="reading.js?v=33"></script>
</body>
</html>
