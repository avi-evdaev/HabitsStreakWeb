<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover + the meta below make it look right when added to the iPhone home screen -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#dcdde1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#24262a" media="(prefers-color-scheme: dark)">
  <title>Nutrition</title>
  <link rel="icon" type="image/png" href="favicon.png?v=22">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=22">
  <link rel="stylesheet" href="style.css?v=22">
</head>
<body>
  <main>
    <a class="back" href="./">&larr; Home</a>
    <header class="bar">
      <a class="logo" href="./"><img src="logo.png?v=22" alt="PROductive home" width="44" height="44"></a>
      <h1>Nutrition</h1>
    </header>

    <!-- shown until Firebase reports whether someone is signed in, so the page is never blank -->
    <p id="checking" class="gate-text">Checking sign-in&hellip;</p>

    <section id="gate" class="gate" hidden>
      <p class="gate-text">Sign in to see your log.</p>
      <button id="sign-in" type="button" class="block primary">Sign in with Google</button>
      <p id="gate-message" class="error" role="alert" hidden></p>
    </section>

    <div id="content" hidden>
      <p id="error" class="error" role="alert" hidden></p>

      <button id="import" type="button" class="block primary" hidden></button>

      <div id="table-wrap" class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Calories</th>
              <th scope="col">Protein (g)</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <section class="stats" aria-label="Averages">
        <div class="stat">
          <span class="stat-label">Avg calories</span>
          <span id="avg-calories" class="stat-value">&mdash;</span>
        </div>
        <div class="stat">
          <span class="stat-label">Avg protein (g)</span>
          <span id="avg-protein" class="stat-value">&mdash;</span>
        </div>
        <div class="stat">
          <span class="stat-label">Days logged</span>
          <span id="days-logged" class="stat-value">&mdash;</span>
        </div>
      </section>

      <section class="chart-box" aria-labelledby="chart-title">
        <h2 id="chart-title" class="chart-title">Calories and protein by day</h2>
        <svg id="chart" viewBox="0 0 360 300" role="img"
             aria-label="Line chart of daily calories and protein times ten. The table above has the same numbers."></svg>
        <div class="legend">
          <span><i class="swatch calories"></i>Calories</span>
          <span><i class="swatch protein"></i>Protein &times; 10</span>
        </div>
        <p class="chart-note">Protein is plotted as grams &times; 10 so both lines share one axis.</p>
      </section>

      <div class="session">
        <span id="status">Loading&hellip;</span>
        <button id="sign-out" type="button" class="small">Sign out</button>
      </div>
    </div>

    <!-- Bump this number on every commit so a stale cached copy is easy to spot -->
    <footer id="build">Build 22 &middot; 2026-10-29 01:21</footer>
  </main>

  <script type="module" src="nutrition.js?v=22"></script>
</body>
</html>
