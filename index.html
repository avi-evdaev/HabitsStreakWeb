<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover + the meta below make it look right when added to the iPhone home screen -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#120402">
  <title>Habits Streak</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Decorative only: hidden from screen readers and ignores taps -->
  <div class="backdrop" aria-hidden="true">
    <div class="embers"></div>
    <svg class="flames" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="gBack" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#ff4a00"/>
          <stop offset=".5" stop-color="#d1160a"/>
          <stop offset="1" stop-color="#5e0300"/>
        </linearGradient>
        <linearGradient id="gMid" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#ffb000"/>
          <stop offset=".55" stop-color="#ff5a00"/>
          <stop offset="1" stop-color="#d1160a"/>
        </linearGradient>
        <linearGradient id="gFront" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#fff6b0"/>
          <stop offset=".5" stop-color="#ffd400"/>
          <stop offset="1" stop-color="#ff8a00"/>
        </linearGradient>
        <!-- Base sits at (0,0) and the tip points up (negative y), so scaling or rotating
             the tongue in CSS pivots around its base, like a real flame. -->
        <path id="tongue" d="M-50 0 C-62 -70 -30 -120 -24 -170 C-20 -205 -4 -235 6 -300
                             C16 -240 44 -215 40 -160 C36 -120 62 -80 50 0 Z"/>
      </defs>

      <g class="layer back">
        <g transform="translate(60 410) scale(1.5 1.15)"><use href="#tongue" style="animation-duration:1.6s;animation-delay:-.2s"/></g>
        <g transform="translate(200 410) scale(1.5 .95)"><use href="#tongue" style="animation-duration:2s;animation-delay:-.9s"/></g>
        <g transform="translate(340 410) scale(1.5 1.25)"><use href="#tongue" style="animation-duration:1.4s;animation-delay:-.5s"/></g>
        <g transform="translate(480 410) scale(1.5 1)"><use href="#tongue" style="animation-duration:2.2s;animation-delay:-1.3s"/></g>
        <g transform="translate(620 410) scale(1.5 1.2)"><use href="#tongue" style="animation-duration:1.8s;animation-delay:-.7s"/></g>
        <g transform="translate(760 410) scale(1.5 .9)"><use href="#tongue" style="animation-duration:1.5s;animation-delay:-1.1s"/></g>
        <g transform="translate(900 410) scale(1.5 1.3)"><use href="#tongue" style="animation-duration:2.1s;animation-delay:-.3s"/></g>
        <g transform="translate(1040 410) scale(1.5 1.05)"><use href="#tongue" style="animation-duration:1.7s;animation-delay:-1.5s"/></g>
        <g transform="translate(1160 410) scale(1.5 1.1)"><use href="#tongue" style="animation-duration:1.9s;animation-delay:-.6s"/></g>
      </g>

      <g class="layer mid">
        <g transform="translate(130 410) scale(1.1 .9)"><use href="#tongue" style="animation-duration:1.3s;animation-delay:-.4s"/></g>
        <g transform="translate(270 410) scale(1.1 .75)"><use href="#tongue" style="animation-duration:1.7s;animation-delay:-1s"/></g>
        <g transform="translate(410 410) scale(1.1 1)"><use href="#tongue" style="animation-duration:1.5s;animation-delay:-.1s"/></g>
        <g transform="translate(550 410) scale(1.1 .8)"><use href="#tongue" style="animation-duration:1.9s;animation-delay:-1.4s"/></g>
        <g transform="translate(690 410) scale(1.1 .95)"><use href="#tongue" style="animation-duration:1.4s;animation-delay:-.8s"/></g>
        <g transform="translate(830 410) scale(1.1 .85)"><use href="#tongue" style="animation-duration:1.8s;animation-delay:-.2s"/></g>
        <g transform="translate(970 410) scale(1.1 1)"><use href="#tongue" style="animation-duration:1.6s;animation-delay:-1.2s"/></g>
        <g transform="translate(1110 410) scale(1.1 .78)"><use href="#tongue" style="animation-duration:1.5s;animation-delay:-.6s"/></g>
      </g>

      <g class="layer front">
        <g transform="translate(90 410) scale(.8 .55)"><use href="#tongue" style="animation-duration:1.1s;animation-delay:-.3s"/></g>
        <g transform="translate(240 410) scale(.8 .45)"><use href="#tongue" style="animation-duration:1.4s;animation-delay:-.9s"/></g>
        <g transform="translate(380 410) scale(.8 .6)"><use href="#tongue" style="animation-duration:1.2s;animation-delay:-.5s"/></g>
        <g transform="translate(520 410) scale(.8 .5)"><use href="#tongue" style="animation-duration:1.5s;animation-delay:-1.1s"/></g>
        <g transform="translate(660 410) scale(.8 .58)"><use href="#tongue" style="animation-duration:1.3s;animation-delay:-.2s"/></g>
        <g transform="translate(800 410) scale(.8 .47)"><use href="#tongue" style="animation-duration:1.6s;animation-delay:-.7s"/></g>
        <g transform="translate(940 410) scale(.8 .6)"><use href="#tongue" style="animation-duration:1.2s;animation-delay:-1.3s"/></g>
        <g transform="translate(1080 410) scale(.8 .52)"><use href="#tongue" style="animation-duration:1.4s;animation-delay:-.4s"/></g>
      </g>
    </svg>
  </div>

  <main>
    <h1>Habits Streak</h1>

    <p id="error" class="error" role="alert" hidden></p>

    <ul id="habit-list"></ul>
    <p id="empty" class="empty" hidden>Nothing is burning yet. Add a habit.</p>

    <form id="add-form">
      <input id="new-habit" type="text" placeholder="New Habit" maxlength="100"
             autocomplete="off" aria-label="New habit name">
      <button type="submit" class="icon add" aria-label="Add habit">+</button>
    </form>

    <!-- Bump this number on every commit so a stale cached copy is easy to spot -->
    <footer id="build">Build 3 &middot; 2026-10-28</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
