<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover + the meta below make it look right when added to the iPhone home screen -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>PROductive</title>
  <!-- start downloading the Firebase files at once instead of one step after another -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="modulepreload" href="firebase.js?v=28">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js">
  <link rel="modulepreload" href="home.js?v=28">
  <!-- Chrome only: starts loading a page in the background when you hover or press its button -->
  <script type="speculationrules">
  {"prerender": [{"source": "list", "urls": ["habits.html", "nutrition.html", "quotes.html"],
                  "eagerness": "moderate"}]}
  </script>
  <link rel="icon" type="image/png" href="favicon.png?v=28">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=28">
  <link rel="stylesheet" href="style.css?v=28">
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <span class="back-slot" aria-hidden="true"></span>
      <a class="logo" href="./"><img src="logo.png?v=28" alt="PROductive logo" width="44" height="44"></a>
      <h1>PROductive</h1>
    </div>
  </header>
  <main>

    <!-- shown until Firebase reports whether someone is signed in, so the page is never blank -->
    <p id="checking" class="gate-text">Checking sign-in&hellip;</p>

    <section id="gate" class="gate" hidden>
      <p class="gate-text">Sign in with Google to continue.</p>
      <button id="sign-in" type="button" class="block primary">Sign in with Google</button>
      <p id="gate-message" class="error" role="alert" hidden></p>
    </section>

    <div id="content" hidden>
      <p id="error" class="error" role="alert" hidden></p>

      <nav class="menu">
        <a class="tile" href="habits.html">
          <span class="tile-name">Habits Streak</span>
          <span class="tile-arrow" aria-hidden="true">&rarr;</span>
        </a>
        <a class="tile" href="pomodoro.html">
          <span class="tile-name">Pomodoro</span>
          <span class="tile-arrow" aria-hidden="true">&rarr;</span>
        </a>
        <a class="tile" href="nutrition.html">
          <span class="tile-name">Nutrition</span>
          <span class="tile-arrow" aria-hidden="true">&rarr;</span>
        </a>
        <a class="tile" href="quotes.html">
          <span class="tile-name">Quotes</span>
          <span class="tile-arrow" aria-hidden="true">&rarr;</span>
        </a>
      </nav>

      <!-- shown only while data from before accounts existed is still waiting to be copied over -->
      <button id="move" type="button" class="block primary" hidden>Move my existing data into this account</button>
      <p id="move-note" class="move-note" hidden></p>

      <!-- one random quote from your Quotes page, picked again on every page load -->
      <blockquote id="home-quote" class="featured-quote home-quote" hidden>
        <p id="home-quote-text" class="quote-text"></p>
        <footer id="home-quote-author" class="quote-author"></footer>
      </blockquote>

      <div class="session">
        <span id="status" class="account">Loading&hellip;</span>
        <button id="sign-out" type="button" class="small">Sign out</button>
      </div>
    </div>

    <!-- Bump this number on every commit so a stale cached copy is easy to spot -->
    <footer id="build">Build 28 &middot; 2026-10-29 15:25</footer>
  </main>

  <script type="module" src="home.js?v=28"></script>
</body>
</html>
